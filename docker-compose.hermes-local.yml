services:
  hermes-local:
    image: kubesight-hermes-local:dev
    build:
      context: ./hermes/hermes/.hermes/hermes-agent
      dockerfile: ../../../../Dockerfile.hermes-local
      secrets:
        - trend_micro_cloud_ca
        - trend_micro_onprem_ca
    container_name: kubesight-hermes-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8642:8642"
    volumes:
      - ./hermes/hermes/.hermes:/opt/data
      - ./hermes-local.runtime.env:/opt/data/.env:ro
      - ${USERPROFILE}/.codex/auth.json:/opt/codex/auth.json:ro
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "kubesight-hermes-local-dev-only-2026"
      API_SERVER_MODEL_NAME: "hermes-agent"
      HERMES_MAX_ITERATIONS: "2"
      CODEX_HOME: "/opt/codex"
      TELEGRAM_BOT_TOKEN: ""
      KUBESIGHT_API_TOKEN: ""
    command: ["gateway", "run", "--replace"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8642/health", timeout=5)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

secrets:
  trend_micro_cloud_ca:
    file: ./hermes/hermes/.hermes/trend-micro-cloud.pem
  trend_micro_onprem_ca:
    file: ./hermes/hermes/.hermes/trend-micro-onprem.pem
