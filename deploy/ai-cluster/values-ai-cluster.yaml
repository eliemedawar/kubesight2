# KubeSight on the AI cluster (OCIDUAI-K8S, OKE 1.36, Cilium, CRI-O).
# Built from ai-cluster-devops-guide.md (version 1, 2026-10-28). Nothing secret
# is in this file: every secret comes from OpenBao through an ExternalSecret.
#
#   helm upgrade --install kubesight charts/kubesight -n kubesight \
#     -f deploy/ai-cluster/values-ai-cluster.yaml \
#     --set image.tag=<x.y.z> --set-string 'commonLabels.areeba\.com/change=<change ID>'
#
# The namespaces exist already (the platform made them), so no --create-namespace.

moduleLabelKey: areeba.com/module
commonLabels:
  # Set per install/upgrade with --set-string (see above).
  areeba.com/change: ""

# The platform owns namespaces and every cluster-wide object.
createNamespaces: false
# The one exception (CHG-KS-005, as in UAT): the backend's reader and deployer
# ClusterRoles, so KubeSight shows and manages this cluster too.
rbac:
  clusterWide: true

# --- OKE clusters in K8s-UAT by workload identity -----------------------------
# The platform's requirements, version 2 (2026-11-10). CHG-KS-015 adds only the
# service account (for the proof); CHG-KS-016 switches the rest on after the proof.
oke:
  provisioner:
    serviceAccount: true                  # CHG-KS-015
    # CHG-KS-016: built by KubeSight CI as kubesight-provisioner:main-21 (own CLI config, 4349c8ad)
    image: registry.areeba.com/kubesight-provisioner@sha256:e3466e5c3b12ebe51bd41e3d547c4301c95d9e944aecc8e3cc5d7352558aaeec
    pullSecret: regcred
  workloadIdentity:
    enabled: true                         # CHG-KS-016
    region: me-dubai-1
    compartmentOcid: ocid1.compartment.oc1..aaaaaaaajihvv42vja5ofypuvvhhxujlknsqwaolivymekmitqzhxxqesqgq
    # Platform owner (Hussein), 2026-11-13: KubeSight manages the OKE clusters
    # it creates with full rights, like the vCenter ones in UAT (any Helm chart).
    backendRole: cluster-admin
    approvalHours: 24
    # Elie, 2026-11-11: admins may approve their own plans (flagged in the email).
    adminSelfApprove: true
    # Elie, 2026-11-11: KubeSight CI keeps rolling out KubeSight itself.
    allowSelfDeploy: true
    notifyEmails: HAllaw@areeba.com
  network:
    # The created clusters' private API endpoints (OCIDUSUBK8SUATMASTER).
    clusterEndpointCIDRs: [10.43.20.128/26]
  stateEncryption:
    enabled: true                         # CHG-KS-016: needs the platform's Transit key kubesight-tofu-state

# --- Images ------------------------------------------------------------------
image:
  # The nodes can pull from it (platform, 2026-10-28).
  registry: registry.areeba.com
  # The first release here: --set image.tag=1.0.0
  tag: ""
imagePullSecret:
  name: regcred
  create: false

# --- Where people reach it ---------------------------------------------------
# Free since UAT moved to another name; its DNS record points at the gateway.
publicHost: kubesight.areeba.com
# The gateway ends TLS, so the chart cannot tell; links stay https.
publicScheme: https
ingress:
  # No ingress controller here: the frontend serves /api itself (below).
  enabled: false

frontend:
  # 1 since 2026-10-30: matched to a kubectl edit made on the cluster.
  replicas: 1
  serveApi: true
  # No TLS in nginx (CHG-KS-004): the Envoy gateway (class areeba-fabric) ends
  # TLS and sends plain HTTP to frontend-service:80. The Service is then
  # ClusterIP 80 -> 80, as edited on the cluster on 2026-10-30. Until then it
  # was an internal OCI load balancer on 443 -> nginx 8443 with kubesight-tls.
  tls:
    secretName: ""
  service:
    type: ClusterIP

# --- Database: pooler-kubesight, verify-full -----------------------------------
database:
  # The platform's Secret postgres (username, password), kept in step with
  # OpenBao by the platform.
  fromLogin:
    secret: postgres
    host: pooler-kubesight.databases.svc
    port: 5432
    name: kubesight
    params: sslmode=verify-full&sslrootcert=/etc/postgres-ca/ca.crt
secrets:
  existingSecret: kubesight-secrets

backend:
  inClusterContextName: ociduai-k8s
  # Inside the cluster registry.areeba.com resolves to its public address
  # (139.185.49.213), which does not answer; the nodes use the internal Nexus.
  # Pinned to it until the platform's DNS gives pods the same answer
  # (CHG-KS-013).
  hostAliases:
    - ip: 10.43.17.16
      hostnames: [registry.areeba.com]
  # OKE upgrades its own control plane; KubeSight must not run kubeadm here.
  autoUpgrade: false
  # KUBESIGHT_OKE_PULL_USERNAME/PASSWORD: the read-only Nexus login KubeSight
  # puts on every OKE cluster it creates (CHG-KS-016).
  extraEnvFromSecrets: [kubesight-oke-pull]
  config:
    ALERT_CPU_THRESHOLD_PERCENT: "80"
    JWT_EXPIRY_HOURS: "8"
    # The login may hold 40 connections; the default pool is 16 + 20 = 36.
    # 12 + 12 leaves room for a restore or a check pod.
    DB_POOL_SIZE: "12"
    DB_MAX_OVERFLOW: "12"
  extraVolumes:
    - {name: postgres-ca, configMap: {name: postgres-ca}}
  extraVolumeMounts:
    - {name: postgres-ca, mountPath: /etc/postgres-ca, readOnly: true}
  persistence:
    # 50 GiB is the smallest OCI block volume; -retain keeps it if the claim goes.
    size: 50Gi
    storageClass: oci-bv-retain

# --- Native CI and analysis: both in kubesight-ci -------------------------------
ci:
  namespace: kubesight-ci
  manageQuota: false
  cache:
    # On NFS (CHG-KS-010): the platform's PersistentVolume kubesight-ci-cache
    # (deploy/ai-cluster/storage/ci-cache-pv.yaml) is reserved for this claim.
    # "-" = no storage class, so the claim binds to that volume and nothing
    # provisions a block volume.
    enabled: true
    size: 100Gi
    storageClass: "-"
analysis:
  namespace: kubesight-ci
  manageQuota: false

buildkit:
  namespace: kubesight-build
  replicas: 2
  image: docker.io/moby/buildkit:v0.23.2-rootless
  # Registry ports buildkitd pushes to and pulls from: the chart's list plus
  # 4443, a Nexus Docker connector (CHG-KS-012), and 80: Dockerfile RUN steps
  # run on BuildKit's network, and apt-get fetches deb.debian.org over plain
  # HTTP (CHG-KS-014).
  egressPorts: [443, 8443, 8082, 5000, 9443, 4443, 80]
  # A 10Gi emptyDir cache with no clean-up limits got a builder evicted
  # mid-build on 2026-11-11 ("Usage of EmptyDir volume "cache" exceeds the
  # limit"). Now each builder has its own 50Gi block volume (OCI's smallest;
  # two fill the namespace's 2 claims / 100Gi) and clean-up keeps the cache
  # at 35GB at most and 10GB free (CHG-KS-018).
  persistence:
    enabled: true
    size: 50Gi
    storageClass: oci-bv
  gc:
    reservedSpace: 5GB
    maxUsedSpace: 35GB
    minFreeSpace: 10GB
  # Inside the cluster registry.areeba.com resolves to its public address
  # (139.185.49.213), which does not answer; the nodes use the internal Nexus.
  # Pinned to it until the platform's DNS gives pods the same answer
  # (CHG-KS-013). BuildKit resolves FROM images itself, so it needs it.
  hostAliases:
    - ip: 10.43.17.16
      hostnames: [registry.areeba.com]
  # The kubesight-build fence: uid 1000, non-root, no added capabilities.
  # null removes the chart default's drop-ALL-add-SETUID/SETGID (Helm merges
  # maps); CRI-O's default capabilities already hold what uid mapping needs.
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    allowPrivilegeEscalation: true
    capabilities: null
    seccompProfile: {type: Unconfined}
    appArmorProfile: {type: Unconfined}
  # Quota: 1 CPU / 2Gi requests, 10Gi memory limits, 4 pods. Two builders fill
  # the requests, so an update replaces one at a time instead of adding a third.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  resources:
    requests: {cpu: 500m, memory: 1Gi, ephemeral-storage: 2Gi}
    limits: {cpu: "2", memory: 4Gi, ephemeral-storage: 10Gi}

# --- Hermes: OpenAI, through a ChatGPT/Codex login, as in UAT ---------------------
# On (CHG-KS-003). For now the login is made inside Hermes after install
# (`hermes auth add openai-codex`, device code, UAT's ChatGPT account) and lives
# only on its volume in /opt/data; no Secret yet.
hermes:
  enabled: true
  # Later, from OpenBao: put the login in kv/kubesight/hermes (field auth.json),
  # set this to hermes and turn on the hermes item under externalSecrets.
  codexAuth:
    existingSecret: ""
  # TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_USERS, TELEGRAM_HOME_CHANNEL, from
  # kv/kubesight/hermes-env (CHG-KS-006): the gateway's Telegram bot.
  extraEnvFromSecrets: [hermes-env]
  # hermes-agent (whose token Hermes uses on the MCP server) is an admin, as
  # Elie decided 2026-10-30 (CHG-KS-007): every tool, every cluster.
  agentRole: admin
  config:
    model:
      default: gpt-5.6-sol
      provider: openai-codex
      base_url: https://chatgpt.com/backend-api/codex
      max_tokens: 8192
    # The `hermes` chat in the pod gets KubeSight's tools only, like the API
    # server (chart default). Left open it loads every built-in tool, and some
    # install their packages from PyPI at first use, which egress drops.
    # skills: without it Hermes never sees the KubeSight skill (CHG-KS-007).
    # memory, session_search, todo: built in, nothing to install (CHG-KS-017)
    # — Hermes learns from tickets and chats; the memory is one, shared.
    platform_toolsets:
      cli: [kubesight, skills, memory, session_search, todo]
      telegram: [kubesight, skills, memory, session_search, todo]
  persistence:
    size: 50Gi
    storageClass: oci-bv-retain
  networkPolicy:
    # chatgpt.com answers the model calls; auth.openai.com renews the login;
    # models.dev lists model features (context size, images), read at start;
    # api.telegram.org carries the Telegram bot (long polling, no way in).
    egressFQDNs: [chatgpt.com, auth.openai.com, models.dev, api.telegram.org]

# --- Secrets: OpenBao -> ExternalSecret -----------------------------------------
externalSecrets:
  enabled: true
  store: {name: openbao, kind: SecretStore}
  items:
    # JWT_SECRET_KEY, FLASK_SECRET_KEY, KUBESIGHT_SECRET_KEY, HERMES_API_TOKEN,
    # KUBESIGHT_HERMES_MCP_TOKEN, KUBESIGHT_INITIAL_ADMIN_PASSWORD
    - {name: kubesight-secrets, key: kubesight/backend}
    # Field auth.json: Hermes's Codex login.
    - {name: hermes, key: kubesight/hermes, module: hermes, enabled: false}
    # Fields TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_USERS, TELEGRAM_HOME_CHANNEL.
    - {name: hermes-env, key: kubesight/hermes-env, module: hermes}
    # Fields KUBESIGHT_OKE_PULL_USERNAME, KUBESIGHT_OKE_PULL_PASSWORD: the
    # read-only Nexus account KubeSight puts on each OKE cluster it creates (K16).
    # CHG-KS-016 switches it on, with backend.extraEnvFromSecrets.
    - {name: kubesight-oke-pull, key: kubesight/oke-pull, module: kubesight-backend, enabled: true}
    # Fields tls.crt and tls.key.
    - {name: kubesight-tls, key: kubesight/tls, type: kubernetes.io/tls, module: kubesight-frontend}
    # Fields registry, username, password; one entry per namespace, because
    # each namespace's store reads only its own path.
    - name: regcred
      key: kubesight/registry
      type: kubernetes.io/dockerconfigjson
      template:
        .dockerconfigjson: '{"auths":{"{{ .registry }}":{"username":"{{ .username }}","password":"{{ .password }}"}}}'
    - name: regcred
      namespace: kubesight-ci
      key: kubesight-ci/registry
      module: kubesight-ci
      type: kubernetes.io/dockerconfigjson
      template:
        .dockerconfigjson: '{"auths":{"{{ .registry }}":{"username":"{{ .username }}","password":"{{ .password }}"}}}'

# --- Network rules ---------------------------------------------------------------
networkPolicies:
  enabled: true
  database:
    namespace: databases
    podLabels: {cnpg.io/poolerName: pooler-kubesight}
    port: 5432
  kubeApiServer: true
  # The Envoy proxy pods of kubesight-gateway (CHG-KS-004), which Envoy
  # Gateway runs in envoy-gateway-system; only this Gateway's pods.
  frontendIngressFrom:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}}
      podSelector:
        matchLabels:
          gateway.envoyproxy.io/owning-gateway-name: kubesight-gateway
          gateway.envoyproxy.io/owning-gateway-namespace: kubesight
  # Added one by one as integrations are configured, each with its change
  # record and firewall request (Bitbucket, Nexus, Zoho/Jira, SMTP, the
  # clusters KubeSight manages, ...).
  backendEgressFQDNs:
    # Alert, sign-in and report emails through Microsoft 365 (CHG-KS-009).
    - {name: smtp.office365.com, ports: [587]}
    # Bitbucket Cloud: its API (repositories, branches, build statuses, pull
    # requests) and Git over HTTPS (CHG-KS-011).
    - {name: api.bitbucket.org}
    - {name: bitbucket.org}
    # Zoho Desk (.com data centre): OAuth token refresh, then the Desk API
    # for field sync, ticket write-back and webhook registration.
    - {name: accounts.zoho.com}
    - {name: desk.zoho.com}
  backendEgressCIDRs:
    # Nexus registry.areeba.com: the image check before every deploy and the
    # registry test in Integrations, Docker API on 443, and on 9443 and 4443,
    # the Docker connectors images are pushed to (CHG-KS-012).
    - {cidr: 10.43.17.16/32, ports: [443, 9443, 4443]}
    # UAT Kubernetes API through its load balancer, so the UAT cluster can be
    # managed from here with its kubeconfig (CHG-KS-019).
    - {cidr: 10.4.27.15/32, ports: [6443]}
