# K4 on the AI cluster: who may act as kubesight-provisioner.
#
# Cluster-wide objects: the PLATFORM applies these (requirements v2, K4: "the
# platform will add an admission rule"), after the OKE proof (the proof pods are
# plain pods made by an administrator and would be refused). CHG-KS-016 asks for it.
#
#   1. a Job running as kubesight-provisioner in kubesight is created only by
#      kubesight-backend, from the fixed template: one container, the
#      provisioner image by digest, the fixed command, no init containers;
#   2. a pod running as kubesight-provisioner belongs to such a Job and runs
#      that same image and command;
#   3. nobody execs, attaches, port-forwards or adds an ephemeral container to
#      a provisioner pod;
#   4. only the kubelet asks for kubesight-provisioner's tokens, and no
#      legacy token Secret is made for it.
#
# The Job's program trusts the backend URL in its environment, so that is pinned
# too (BACKEND below = KubeSight's backend Service). Check after applying: the
# job controller's user on OKE is system:serviceaccount:kube-system:job-controller
# (a provisioner Job whose pod never appears means it is another name: read
# `kubectl -n kubesight get events` and adjust the pods rule).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubesight-provisioner-jobs
  labels: {areeba.com/module: kubesight-provisioner}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: kubesight}
    resourceRules:
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  variables:
    - name: pod
      expression: "object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec : object.spec.template.spec"
  validations:
    - expression: >-
        !has(variables.pod.serviceAccountName) || variables.pod.serviceAccountName != 'kubesight-provisioner' || (
          object.kind == 'Job' &&
          request.userInfo.username == 'system:serviceaccount:kubesight:kubesight-backend' &&
          !has(variables.pod.initContainers) &&
          variables.pod.containers.size() == 1 &&
          variables.pod.containers[0].image.startsWith('registry.areeba.com/kubesight-provisioner@sha256:') &&
          variables.pod.containers[0].command == ['/usr/local/bin/kubesight-provision'] &&
          !has(variables.pod.containers[0].args) &&
          variables.pod.containers[0].env.exists(e, e.name == 'KUBESIGHT_BACKEND_URL' &&
            e.value == 'http://backend-service.kubesight.svc.cluster.local:5000') &&
          variables.pod.volumes.all(v, v.name in ['work', 'tmp', 'backend-token', 'openbao-ca'])
        )
      message: Only KubeSight's backend creates provisioner Jobs, from its fixed template.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kubesight-provisioner-jobs
  labels: {areeba.com/module: kubesight-provisioner}
spec:
  policyName: kubesight-provisioner-jobs
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubesight-provisioner-pods
  labels: {areeba.com/module: kubesight-provisioner}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: kubesight}
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  validations:
    - expression: >-
        !has(object.spec.serviceAccountName) || object.spec.serviceAccountName != 'kubesight-provisioner' || (
          request.userInfo.username == 'system:serviceaccount:kube-system:job-controller' &&
          has(object.metadata.ownerReferences) &&
          object.metadata.ownerReferences.exists(o, o.kind == 'Job' && o.name.startsWith('kubesight-provision-')) &&
          !has(object.spec.initContainers) &&
          !has(object.spec.ephemeralContainers) &&
          object.spec.containers.size() == 1 &&
          object.spec.containers[0].image.startsWith('registry.areeba.com/kubesight-provisioner@sha256:') &&
          object.spec.containers[0].command == ['/usr/local/bin/kubesight-provision'] &&
          !has(object.spec.containers[0].args) &&
          object.spec.containers[0].env.exists(e, e.name == 'KUBESIGHT_BACKEND_URL' &&
            e.value == 'http://backend-service.kubesight.svc.cluster.local:5000')
        )
      message: Pods run as kubesight-provisioner only from KubeSight's provisioner Jobs.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kubesight-provisioner-pods
  labels: {areeba.com/module: kubesight-provisioner}
spec:
  policyName: kubesight-provisioner-pods
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubesight-provisioner-no-entry
  labels: {areeba.com/module: kubesight-provisioner}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: kubesight}
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CONNECT]
        resources: [pods/exec, pods/attach, pods/portforward]
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [serviceaccounts/token]
  validations:
    - expression: >-
        request.subResource == 'token'
          ? (request.name != 'kubesight-provisioner' || request.userInfo.username.startsWith('system:node:'))
          : !request.name.startsWith('kubesight-provision-')
      message: Nobody enters a provisioner pod or takes kubesight-provisioner's token.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kubesight-provisioner-no-entry
  labels: {areeba.com/module: kubesight-provisioner}
spec:
  policyName: kubesight-provisioner-no-entry
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kubesight-provisioner-no-token-secret
  labels: {areeba.com/module: kubesight-provisioner}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: kubesight}
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
  validations:
    - expression: >-
        !(has(object.type) && object.type == 'kubernetes.io/service-account-token' &&
          has(object.metadata.annotations) &&
          'kubernetes.io/service-account.name' in object.metadata.annotations &&
          object.metadata.annotations['kubernetes.io/service-account.name'] == 'kubesight-provisioner')
      message: No long-lived token Secret for kubesight-provisioner.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kubesight-provisioner-no-token-secret
  labels: {areeba.com/module: kubesight-provisioner}
spec:
  policyName: kubesight-provisioner-no-token-secret
  validationActions: [Deny]
