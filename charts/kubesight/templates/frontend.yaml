{{- $ns := include "kubesight.namespace" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesight-frontend
  namespace: {{ $ns }}
  labels:
    {{- include "kubesight.labels" . | nindent 4 }}
    app: kubesight-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: kubesight-frontend
  template:
    metadata:
      labels:
        app: kubesight-frontend
    spec:
      automountServiceAccountToken: false
      {{- include "kubesight.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "kubesight.image" (dict "root" . "repo" .Values.image.frontendRepository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: {{ $ns }}
  labels:
    {{- include "kubesight.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: kubesight-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
