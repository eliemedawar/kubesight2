{{- $ns := include "kubesight.namespace" . }}
{{- $fe := .Values.frontend }}
{{- $tlsSecret := and $fe.serveApi $fe.tls.secretName }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesight-frontend
  namespace: {{ $ns }}
  labels:
    {{- include "kubesight.labels" (dict "root" . "module" "kubesight-frontend") | nindent 4 }}
    app: kubesight-frontend
spec:
  replicas: {{ $fe.replicas }}
  selector:
    matchLabels:
      app: kubesight-frontend
  template:
    metadata:
      labels:
        app: kubesight-frontend
        {{- with include "kubesight.podLabels" (dict "root" . "module" "kubesight-frontend") }}{{ . | nindent 8 }}{{ end }}
      {{- if $fe.serveApi }}
      annotations:
        checksum/nginx: {{ include (print $.Template.BasePath "/frontend-nginx.yaml") . | sha256sum }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- include "kubesight.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "kubesight.image" (dict "root" . "repo" .Values.image.frontendRepository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            {{- if $tlsSecret }}
            - name: https
              containerPort: 8443
              protocol: TCP
            {{- end }}
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml $fe.resources | nindent 12 }}
          {{- if $fe.serveApi }}
          volumeMounts:
            - name: nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            {{- if $tlsSecret }}
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if $fe.serveApi }}
      volumes:
        - name: nginx
          configMap:
            name: kubesight-frontend-nginx
        {{- if $tlsSecret }}
        - name: tls
          secret:
            secretName: {{ $tlsSecret }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: {{ $ns }}
  labels:
    {{- include "kubesight.labels" (dict "root" . "module" "kubesight-frontend") | nindent 4 }}
  {{- with $fe.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $fe.service.type }}
  {{- with $fe.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  selector:
    app: kubesight-frontend
  ports:
    {{- if $tlsSecret }}
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    {{- else }}
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    {{- end }}
