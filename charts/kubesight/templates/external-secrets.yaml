{{- /*
Secrets delivered by the External Secrets Operator from a secret store
(OpenBao, Vault, ...), so no secret value is ever rendered by Helm. Point
secrets.existingSecret, database.existingSecret, hermes.extraEnvFromSecrets and
imagePullSecret.name at the Secrets these create.
*/ -}}
{{- if .Values.externalSecrets.enabled }}
{{- $ns := include "kubesight.namespace" . }}
{{- range .Values.externalSecrets.items }}
{{- /* enabled: false keeps an item listed but off. */ -}}
{{- if ne (toString .enabled) "false" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "externalSecrets.items[].name is required" .name }}
  namespace: {{ .namespace | default $ns }}
  labels:
    {{- include "kubesight.labels" (dict "root" $ "module" (.module | default "kubesight-backend")) | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval | default $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.store.name }}
    kind: {{ $.Values.externalSecrets.store.kind }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    {{- if or .type .template }}
    template:
      {{- with .type }}
      type: {{ . }}
      {{- end }}
      {{- with .template }}
      # Only these keys reach the Secret.
      data:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  dataFrom:
    - extract:
        key: {{ required "externalSecrets.items[].key is required: the path in the store" .key }}
{{- end }}
{{- end }}
{{- end }}
