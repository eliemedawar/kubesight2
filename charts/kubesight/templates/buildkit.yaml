{{- if include "kubesight.buildkitEnabled" . }}
{{- with .Values.buildkit }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: buildkitd
  namespace: {{ .namespace }}
  labels:
    {{- include "kubesight.labels" (dict "root" $ "module" "kubesight-buildkit") | nindent 4 }}
automountServiceAccountToken: false
---
# BuildKit sizes its cache clean-up from the disk under the cache, not from the
# cache's own limit: with no limits here an emptyDir cache grows past its
# sizeLimit and the kubelet evicts the builder mid-build. Rootless buildkitd
# reads ~/.config/buildkit/buildkitd.toml on its own.
{{- $toml := include "kubesight.buildkitToml" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd-config
  namespace: {{ .namespace }}
  labels:
    {{- include "kubesight.labels" (dict "root" $ "module" "kubesight-buildkit") | nindent 4 }}
data:
  buildkitd.toml: |
    {{- $toml | nindent 4 }}
---
apiVersion: apps/v1
{{- /* With persistence each builder keeps its cache on its own volume: a
StatefulSet, one claim per builder. Without, a Deployment and an emptyDir. */}}
kind: {{ if .persistence.enabled }}StatefulSet{{ else }}Deployment{{ end }}
metadata:
  name: buildkitd
  namespace: {{ .namespace }}
  labels:
    {{- include "kubesight.labels" (dict "root" $ "module" "kubesight-buildkit") | nindent 4 }}
    app: buildkitd
spec:
  # Image stages use the first builder that answers from its own node, so a
  # second replica on another node is the failover.
  replicas: {{ .replicas }}
  {{- if .persistence.enabled }}
  serviceName: buildkitd-pods
  # Both builders start together; an update still replaces one at a time, so
  # it never needs room for a third pod.
  podManagementPolicy: Parallel
  # The cache is disposable: its claims go with the builders.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
  {{- else }}
  {{- with .strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  selector:
    matchLabels:
      app: buildkitd
  template:
    metadata:
      labels:
        app: buildkitd
        {{- with include "kubesight.podLabels" (dict "root" $ "module" "kubesight-buildkit") }}{{ . | nindent 8 }}{{ end }}
      annotations:
        checksum/config: {{ $toml | sha256sum }}
        {{- /* Kubernetes 1.30+ takes securityContext.appArmorProfile instead. */}}
        {{- if not (hasKey .securityContext "appArmorProfile") }}
        container.apparmor.security.beta.kubernetes.io/buildkitd: unconfined
        {{- end }}
    spec:
      serviceAccountName: buildkitd
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- if .persistence.enabled }}
      # A new volume is root's: the group lets uid 1000 write the cache.
      securityContext:
        fsGroup: {{ .securityContext.runAsGroup | default 1000 }}
        fsGroupChangePolicy: OnRootMismatch
      {{- end }}
      {{- with .hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: buildkitd
      containers:
        - name: buildkitd
          image: {{ .image }}
          imagePullPolicy: IfNotPresent
          args:
            - --addr
            - tcp://0.0.0.0:1234
            - --oci-worker-no-process-sandbox
          ports:
            - containerPort: 1234
              protocol: TCP
          readinessProbe:
            exec:
              command: [buildctl, --addr, tcp://127.0.0.1:1234, debug, workers]
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .resources | nindent 12 }}
          securityContext:
            {{- toYaml .securityContext | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: /home/user/.local/share/buildkit
            - name: config
              mountPath: /home/user/.config/buildkit/buildkitd.toml
              subPath: buildkitd.toml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: buildkitd-config
        {{- if not .persistence.enabled }}
        - name: cache
          emptyDir:
            sizeLimit: {{ .cacheSize }}
        {{- end }}
  {{- if .persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: cache
        # Fixed labels only: Kubernetes never lets a StatefulSet's claim
        # template change, so the per-upgrade change label (commonLabels) and
        # the chart version must not be in it, or every upgrade is refused.
        labels:
          app.kubernetes.io/part-of: kubesight
          app.kubernetes.io/instance: {{ $.Release.Name }}
          {{- include "kubesight.podLabels" (dict "root" $ "module" "kubesight-buildkit") | nindent 10 }}
          kubesight.io/purpose: buildkit-cache
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .persistence.storageClass }}
        storageClassName: {{ if eq . "-" }}""{{ else }}{{ . }}{{ end }}
        {{- end }}
        resources:
          requests:
            storage: {{ .persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: {{ .namespace }}
  labels:
    {{- include "kubesight.labels" (dict "root" $ "module" "kubesight-buildkit") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: buildkitd
  ports:
    - port: 1234
      targetPort: 1234
      protocol: TCP
---
# One DNS record per builder (CI_BUILDKIT_POOL), for failover.
apiVersion: v1
kind: Service
metadata:
  name: buildkitd-pods
  namespace: {{ .namespace }}
  labels:
    {{- include "kubesight.labels" (dict "root" $ "module" "kubesight-buildkit") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: buildkitd
  ports:
    - port: 1234
      targetPort: 1234
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: buildkitd
  namespace: {{ .namespace }}
  labels:
    {{- include "kubesight.labels" (dict "root" $ "module" "kubesight-buildkit") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: buildkitd
  policyTypes: [Ingress, Egress]
  ingress:
    # Only build pods talk to the builders.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.ci.namespace }}
      ports:
        - port: 1234
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    # Registries and base-image sources.
    - ports:
        {{- range .egressPorts }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
{{- end }}
{{- end }}
