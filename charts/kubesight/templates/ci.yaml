{{- if include "kubesight.ciEnabled" . }}
{{- $ns := include "kubesight.namespace" . }}
{{- with .Values.ci }}
# Build pods run as this account, with no API access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubesight-ci-build
  namespace: {{ .namespace }}
  labels:
    {{- include "kubesight.labels" (dict "root" $ "module" "kubesight-ci") | nindent 4 }}
automountServiceAccountToken: false
{{- with $.Values.imagePullSecret.name }}
imagePullSecrets:
  - name: {{ . }}
{{- end }}
---
# What the backend needs to run builds here, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubesight-ci-launcher
  namespace: {{ .namespace }}
  labels:
    {{- include "kubesight.labels" (dict "root" $ "module" "kubesight-ci") | nindent 4 }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, delete, patch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, get, delete, patch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubesight-ci-launcher
  namespace: {{ .namespace }}
  labels:
    {{- include "kubesight.labels" (dict "root" $ "module" "kubesight-ci") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubesight-ci-launcher
subjects:
  - kind: ServiceAccount
    name: kubesight-backend
    namespace: {{ $ns }}
{{- /* Off where the platform already sets the namespace's quota and defaults. */ -}}
{{- if .manageQuota }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ci-quota
  namespace: {{ .namespace }}
  labels:
    {{- include "kubesight.labels" (dict "root" $ "module" "kubesight-ci") | nindent 4 }}
spec:
  hard:
    {{- toYaml .quota | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ci-defaults
  namespace: {{ .namespace }}
  labels:
    {{- include "kubesight.labels" (dict "root" $ "module" "kubesight-ci") | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        {{- toYaml .limitRange.default | nindent 8 }}
      defaultRequest:
        {{- toYaml .limitRange.defaultRequest | nindent 8 }}
{{- end }}
{{- if .cache.enabled }}
{{- include "kubesight.volume" (dict "root" $ "cfg" .cache "name" .cache.claimName "namespace" .namespace "purpose" "ci-dependency-cache" "module" "kubesight-ci") }}
{{- end }}
{{- end }}
{{- end }}
