{{- $ns := include "kubesight.namespace" . }}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "kubesight.secretName" . }}
{{- /* Reuse what the cluster already holds, so an upgrade never rotates a key. */ -}}
{{- $old := dict }}
{{- with (lookup "v1" "Secret" $ns $name) }}
{{- $old = .data | default dict }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "kubesight.labels" (dict "root" . "module" "kubesight-backend") | nindent 4 }}
  annotations:
    # KUBESIGHT_SECRET_KEY decrypts every stored credential: never delete it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  JWT_SECRET_KEY: {{ get $old "JWT_SECRET_KEY" | default (randAlphaNum 64 | b64enc) | quote }}
  FLASK_SECRET_KEY: {{ get $old "FLASK_SECRET_KEY" | default (randAlphaNum 64 | b64enc) | quote }}
  KUBESIGHT_SECRET_KEY: {{ get $old "KUBESIGHT_SECRET_KEY" | default (randAlphaNum 64 | b64enc) | quote }}
  # Backend -> Hermes API (Hermes's API_SERVER_KEY).
  HERMES_API_TOKEN: {{ get $old "HERMES_API_TOKEN" | default (randAlphaNum 48 | b64enc) | quote }}
  # Hermes -> KubeSight MCP; the backend registers it for hermes-agent on boot.
  KUBESIGHT_HERMES_MCP_TOKEN: {{ get $old "KUBESIGHT_HERMES_MCP_TOKEN" | default (printf "ksa_%s" (randAlphaNum 40 | lower) | b64enc) | quote }}
  # Used once: the first sign-in replaces it and enrols MFA.
  KUBESIGHT_INITIAL_ADMIN_PASSWORD: {{ get $old "KUBESIGHT_INITIAL_ADMIN_PASSWORD" | default (randAlphaNum 20 | b64enc) | quote }}
{{- end }}
{{- if and (not .Values.database.existingSecret) (not .Values.database.fromLogin.secret) .Values.database.url }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubesight.fullname" . }}-database
  namespace: {{ $ns }}
  labels:
    {{- include "kubesight.labels" (dict "root" . "module" "kubesight-backend") | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
{{- with .Values.imagePullSecret }}
{{- if and .create .name }}
{{- $auth := printf "%s:%s" (required "imagePullSecret.username is required when imagePullSecret.create is true" .username) (required "imagePullSecret.password is required when imagePullSecret.create is true" .password) | b64enc }}
{{- $config := dict "auths" (dict .server (dict "username" .username "password" .password "auth" $auth)) | toJson | b64enc }}
{{- $namespaces := list $ns }}
{{- if include "kubesight.ciEnabled" $ }}{{ $namespaces = append $namespaces $.Values.ci.namespace }}{{ end }}
{{- if include "kubesight.buildkitEnabled" $ }}{{ $namespaces = append $namespaces $.Values.buildkit.namespace }}{{ end }}
{{- if $.Values.analysis.enabled }}{{ $namespaces = append $namespaces $.Values.analysis.namespace }}{{ end }}
{{- range $namespaces }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.imagePullSecret.name }}
  namespace: {{ . }}
  labels:
    {{- include "kubesight.labels" (dict "root" $ "module" "kubesight-backend") | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $config }}
{{- end }}
{{- end }}
{{- end }}
