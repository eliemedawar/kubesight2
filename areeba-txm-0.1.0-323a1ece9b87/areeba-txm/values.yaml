  - name: PCEPAR_OBAPI_PROXY_PORT
    value: "NULL"
  - name: PCEPAR_NDC_ENDPOINTS
    value: "127.0.0.1:9001"
  - name: PCEPAR_NDC_THREADPOOL_CORESIZE
    value: "70"
  - name: PCEPAR_NDC_THREADPOOL_MAXQUEUESIZE
    value: "1000"
  - name: PCEPAR_NDC_THREADPOOL_QUEUESIZE_REJECTION_THRESHOLD
    value: "1000"
  - name: PCEPAR_NDC_PREFERRED_ADAPTER
    value: ""
  - name: PCEPAR_NDC_MAX_CONNECTIONS_PER_EIS_PH
    value: "20000"
  - name: PCEPAR_NDC_MAX_CONNECTION_PER_SERVER
    value: "1000"
  - name: PCEPAR_HISO_DEVICE_HANDLING_SELFSERVICE_ENDPOINTS
    value: "127.0.0.1:15631"
  - name: PCEPAR_BICISO_DEVICE_HANDLING_SELFSERVICE_ENDPOINTS
    value: "127.0.0.1:15731"
  - name: PCEPAR_CHAMELEON_PORT
    value: "1231"
  - name: PCEPAR_CHAMELEON_MULTIPLEX_PORT
