# Base defaults, common to every environment. Environment-specific overrides
# live in values-dev.yaml / values-uat.yaml / values-prod.yaml and are passed
# with `-f` (later files win) - never fork the chart per environment.

replicaCount: 1   # see deploy/README.md "Statefulness" note before scaling >1

image:
  repository: registry.example.internal/areeba/txm-server   # TODO: real registry
  tag: ""            # REQUIRED at deploy time: immutable tag, e.g. git SHA or
                     # semver (1.4.2-build.9). Never use "latest".
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: registry-credentials

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}

# Deliberately no runAsUser AND no fsGroup here. On OpenShift, the
# "restricted"/"restricted-v2" SCC assigns an arbitrary UID *and* a
# namespace-specific supplemental-groups range per project (see
# `oc get project <ns> -o yaml`, annotation
# openshift.io/sa.scc.supplemental-groups) - GID 0 is normally NOT in that
# range and gets hard-rejected at admission
# (".spec.securityContext.fsGroup: Invalid value: 0: 0 is not an allowed
# group" - hit for real deploying to quantech-areeba-tm-dev). Leaving
# fsGroup unset lets OpenShift auto-assign one from the namespace's actual
# allowed range. The image itself (see deploy/docker/Dockerfile) is built
# GID-0/group-writable so it works under whatever UID/GID actually gets
# assigned there, and under the image's own "txm" user on plain
# Kubernetes. On plain Kubernetes (no SCC), there's no such restriction -
# set an explicit fsGroup in values-customer-*.yaml there instead (0 is
# fine unless a hardened Kyverno/OPA policy also disallows it).
podSecurityContext:
  fsGroupChangePolicy: OnRootMismatch

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 3Gi

service:
  type: ClusterIP
  httpPort: 8080
  # Add any additional terminal-driving/switch TCP ports TM listens on here.
  extraPorts: []
  # - name: iso8583-visa
  #   port: 9001
  #   targetPort: 9001

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: txm.example.internal
      paths:
        - path: /
          pathType: Prefix
  tls: []

# OpenShift-native alternative to ingress.*. OpenShift's router honors
# plain Ingress objects too, but Route is idiomatic and gets you an
# edge/TLS-terminated URL on the cluster's default wildcard domain for
# free - handy for a quick test cluster with no real DNS/cert-manager set
# up yet. Set exactly one of ingress.enabled / openshift.route.enabled.
openshift:
  enabled: false      # set true when deploying to OpenShift
  route:
    enabled: false    # set true (with openshift.enabled) to create a Route
    host: ""           # "" = let OpenShift assign one on the default wildcard domain
    tls:
      termination: edge   # edge | passthrough | reencrypt

# JTA/Narayana transaction log + emergency-cash journal persistence.
# TM keeps local on-disk state (bin/ObjectStore, emergency/) that must
# survive pod restarts/rescheduling - see deploy/README.md "Statefulness".
persistence:
  objectStore:
    enabled: true
    size: 5Gi
    storageClassName: ""   # "" = cluster default
  emergency:
    enabled: true
    size: 5Gi
    storageClassName: ""
  logs:
    enabled: true
    size: 10Gi
    storageClassName: ""

# Non-secret half of install/tmoptions (see deploy/README.md "tmoptions").
# Rendered into a ConfigMap as tmoptions.env, merged at container start with
# the Secret's tmoptions-secret.env, then run through
# install/updatefilelist.sh - see templates/configmap.yaml and
# deploy/docker/entrypoint.sh. Never put PCEPAR_*_USER/_PW,
# PCEPAR_INITIAL_PASSWORD, or anything else credential-shaped here - those
# belong in secrets.* / the externally-managed Secret below.
#
# Base defaults below are non-secret keys straight from
# install/tmoptions.orig that stay the same across environments; per-env
# overrides (endpoints, HSM address, DB host, topology, log level) live in
# values-dev/uat/prod.yaml.
tmoptions:
  # Ordered list, NOT a map. install/install.sh consumes install/tmoptions
  # via `set -a; eval "$(cat tmoptions | ...)"; set +a` - i.e. it evaluates
  # the file top-to-bottom as shell, so keys that self-reference earlier
  # ones via ${PCEPAR_...} depend on file ORDER. A Helm map would render
  # alphabetically instead (Go template map iteration is always sorted),
  # silently breaking those references. This list preserves the exact
  # order of the real generated tmoptions.orig (from a real
  # `gradlew :Areeba-sdp-devhandler-assembly:installDist`) instead.
  #
  # Per-environment overrides go in tmoptions.envOverrides (a plain map -
  # order doesn't matter there since it's just applied on top of this list
  # by name at render time, see templates/configmap.yaml). Don't redefine
  # tmoptions.nonSecret in values-dev/uat/prod.yaml - Helm replaces whole
  # lists on override rather than merging them, which would silently drop
  # every other key.
  #
  # Two values below are deliberately different from the shipped default:
  # PCEPAR_PCE_HOME (matches this chart's container layout, not the
  # product's own /opt/pcestd default). PCEPAR_CARDDATA_CONNECTION does not
  # exist in this repo's tmoptions.orig (that override applied only to the
  # other, 4.1-based delivery repo's build.gradle customization).
