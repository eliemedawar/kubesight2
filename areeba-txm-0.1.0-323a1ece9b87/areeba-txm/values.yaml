    value: "localhost"

  # Non-secret per-environment overrides, applied by name on top of
  # nonSecret above - see values-dev/uat/prod.yaml.
  envOverrides: {}
# Secrets are expected to already exist in the target namespace, created out
# of band by an External Secrets Operator / Vault / cluster admin - NOT by
# Helm, and NEVER checked into this repo. See deploy/README.md "Secrets".
secrets:
  existingSecretName: "txm-secrets"   # must contain DB_PASSWORD, and the
                                       # mounted keystore(s) referenced below

probes:
  # Confirmed against a real running instance (local: successfully reached
  # http://localhost:8080/pages/Login.jsf?jfwid=...). The jfwid query
  # param is a per-request JSF window id, not needed for a bare liveness/
  # readiness GET - the bare path returns the login page (200) once TM is
  # actually up. Still worth re-confirming this doesn't require session
  # state once the DB is wired in (task 1) - some JSF apps redirect an
  # unauthenticated GET, which would show up as the probe getting a
  # 3xx instead of 200 and needs httpGet path/expected code adjusted.
  #
  # startupProbe gates when liveness/readiness even start being evaluated -
  # added after `oc describe pod` showed the real failure mode: TM's cold
  # boot (entrypoint.sh copy+template + JVM start + full CDI/component
  # init) legitimately runs past 2 minutes, and the old liveness budget
  # (60s + 15s*6 = 150s) was killing the container mid-boot -
  # "Liveness probe failed ... Killing" while Jetty had already started
  # and TM was still working through startup nodes, not stuck. Without a
  # startupProbe, liveness/readiness start counting immediately on
  # container start and have no way to distinguish "still legitimately
  # booting" from "actually hung".
  startup:
    httpGet:
      path: /pages/Login.jsf
      port: http
    initialDelaySeconds: 20
    periodSeconds: 10
    failureThreshold: 90   # up to ~15 min to come up once, cold
  liveness:
    httpGet:
      path: /pages/Login.jsf
      port: http
    periodSeconds: 15
    failureThreshold: 6
  readiness:
    httpGet:
      path: /pages/Login.jsf
      port: http
    periodSeconds: 10
    failureThreshold: 3

# TM terminals hold long-lived connections; give in-flight sessions and open
# JTA transactions time to drain before SIGKILL.
terminationGracePeriodSeconds: 90

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
