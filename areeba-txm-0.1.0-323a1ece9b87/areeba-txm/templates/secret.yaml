{{/*
This chart deliberately does NOT template a raw Kubernetes Secret with
inline values from values.yaml - that would put DB passwords, the initial
admin password, and the HSM keystore passphrase in plaintext in git and in
`helm get values` / release history.

.Values.secrets.existingSecretName ("txm-secrets" by default) is expected
to already exist in the target namespace, created out-of-band (External
Secrets Operator / Vault / a cluster admin) - see deploy/README.md
"Secrets". It must contain, at minimum:

  tmoptions-secret.env  - a properties-file blob merged with the
                           ConfigMap's tmoptions.env by entrypoint.sh
                           before updatefilelist.sh runs. At minimum:
                             PCEPAR_DB_USER=...
                             PCEPAR_DB_PW=...
                             PCEPAR_DB_BUSINESS_USER=...
                             PCEPAR_DB_BUSINESS_PW=...
                             PCEPAR_DB_EMERGENCY_USER=...
                             PCEPAR_DB_EMERGENCY_PW=...
                             PCEPAR_DB_MIGRATION_USER=...
                             PCEPAR_DB_MIGRATION_PW=...
                             PCEPAR_INITIAL_PASSWORD=<pre-hashed or plain,
                               confirm which with DN - install.sh normally
                               prompts for this interactively>
  keystore.ks            - the DN-SRKL/Thales keystore file (binary)

If your org already runs the External Secrets Operator, uncomment and adapt
the block below instead of managing the Secret out of band.
*/}}
{{- if .Values.externalSecret | default false }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.existingSecretName }}
  labels:
    {{- include "txm.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: vault-backend   # TODO: point at your actual SecretStore
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.existingSecretName }}
  data:
    - secretKey: tmoptions-secret.env
      remoteRef:
        key: {{ .Release.Namespace }}/txm/tmoptions-secret
        property: tmoptions-secret.env
    - secretKey: keystore.ks
      remoteRef:
        key: {{ .Release.Namespace }}/txm/hsm
        property: keystore
{{- end }}
