apiVersion: v1
kind: Service
metadata:
  name: {{ include "txm.fullname" . }}
  labels:
    {{- include "txm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "txm.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
    {{- range .Values.service.extraPorts }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
    {{- end }}
---
# Headless service required by the StatefulSet for stable per-pod DNS
# identity (used for peer/cluster discovery if the TM farm needs it).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "txm.fullname" . }}-headless
  labels:
    {{- include "txm.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "txm.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
