# BuildKit for native CI container image builds — OPT-IN, off by default.
#
# KubeSight does not run this automatically. Container image stages stay
# skipped (with an explanation in the stage log) until an operator applies this
# file AND sets CI_BUILDKIT_ADDR on the backend, e.g.:
#   CI_BUILDKIT_ADDR=tcp://buildkitd.kubesight-buildkit.svc.cluster.local:1234
#
# ─────────────────────────────────────────────────────────────────────────────
# SECURITY DISCLOSURE — read before applying
#
# WHY seccompProfile: Unconfined IS REQUIRED HERE
#   Rootless BuildKit executes Dockerfile RUN steps inside nested user
#   namespaces. Creating those namespaces needs syscalls (unshare/clone with
#   CLONE_NEWUSER, mount) that the RuntimeDefault seccomp profile blocks for
#   unprivileged processes. There is no rootless-daemon configuration that
#   works under RuntimeDefault today; this is a documented upstream
#   requirement of buildkit rootless mode, not a KubeSight choice.
#
# WHY SETUID/SETGID AND no_new_privs ARE REQUIRED HERE
#   Before buildkitd starts, rootlesskit maps a range of subordinate UIDs into
#   the namespace using the setuid helpers /usr/bin/newuidmap and newgidmap.
#   A setuid binary cannot elevate when allowPrivilegeEscalation is false
#   (no_new_privs), and cannot hold CAP_SETUID/CAP_SETGID when those are
#   outside the bounding set — dropping ALL removes them. Deny either and the
#   daemon dies at startup: "newuidmap ... operation not permitted".
#
# WHAT --oci-worker-no-process-sandbox CONCEDES (buildkitd warns about it on
# every boot, so it is stated here rather than left as a surprise)
#   Without the process sandbox, a Dockerfile RUN step can signal — and
#   potentially ptrace — other processes inside THIS pod's namespace. The pod
#   runs nothing but buildkitd, so the reachable set is buildkitd itself and
#   concurrent builds sharing it. That is the accepted cost of one shared
#   builder; if builds from different trust levels must not touch each other,
#   run separate buildkitd Deployments rather than removing the flag (the flag
#   is required for rootless operation in an unprivileged container).
#
# EXACT SECURITY CONTEXT GRANTED (and nothing more):
#   - seccompProfile: Unconfined            (relaxation 1)
#   - AppArmor: Unconfined                  (same reason, on hosts w/ AppArmor)
#   - allowPrivilegeEscalation: true        (relaxation 2, for the setuid map
#     + capabilities: SETUID, SETGID         helpers — nothing else is added)
#   - runAsUser 1000 / runAsNonRoot: true   (never root)
#   - capabilities: drop ALL, then add back exactly those two
#   - privileged: NOT set (false)
#   - ONE host mount: /data/buildkit (layer cache, see "Layer cache on /data"
#     below); no docker socket, no hostNetwork/hostPID
#   - a short root init container that only chowns that one directory to
#     uid 1000 (CHOWN is its only capability), then exits
#
# BLAST RADIUS / IMPACT
#   The relaxation applies to THIS one Deployment in its own namespace
#   (kubesight-buildkit). That namespace must run at PSA level `privileged`,
#   because BOTH `restricted` AND `baseline` reject Unconfined seccomp/AppArmor
#   (baseline allows only unset/RuntimeDefault/Localhost). Read `privileged`
#   here as "PSA does not police this namespace" — it does NOT make the
#   container privileged: privileged stays false, uid stays 1000, and every
#   capability except SETUID/SETGID stays dropped. The pod spec below is the
#   real boundary, so deploy nothing else into this namespace.
#   Build pods in kubesight-ci remain fully `restricted`; they only hold a
#   buildctl *client*, which needs no relaxation. An escape from buildkitd is
#   bounded by: non-root uid, only SETUID/SETGID available, no host mount but
#   its own /data/buildkit cache directory, and
#   a NetworkPolicy that only admits traffic from kubesight-ci and
#   only lets buildkitd reach registries/DNS. What this concedes is a larger
#   kernel syscall attack surface for the buildkitd process itself, and a
#   setuid path it can use to become another UID inside its own namespace.
#
# ALTERNATIVES CONSIDERED
#   - DinD / privileged builders ............ strictly worse; rejected outright
#   - Host docker socket mount .............. root-equivalent on the node; rejected
#   - Kaniko ................................ archived upstream; rejected
#   - buildctl-daemonless in each build pod . would need Unconfined on EVERY
#                                             build pod; centralizing it here
#                                             keeps untrusted stages restricted
#   - Dedicated build VM (rootless buildkit
#     outside Kubernetes) ................... valid alternative when cluster
#                                             policy forbids Unconfined anywhere;
#                                             lands with the external Linux
#                                             runner agent (Phase 5)
#
# HARDENING TODO (tracked): mTLS on the buildkitd listener. Until then the
# listener is plain TCP restricted by NetworkPolicy to the kubesight-ci
# namespace. Do not expose this Service outside the cluster.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: kubesight-buildkit
  labels:
    kubesight.io/purpose: image-builder
    # `privileged` is the only PSA level that admits Unconfined seccomp and
    # AppArmor, which rootless buildkitd needs (see the disclosure above).
    # baseline rejects both — it is NOT a usable middle ground here.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: buildkitd
  namespace: kubesight-buildkit
automountServiceAccountToken: false
---
# Garbage collection for the /data/buildkit cache. Sizes are of the WHOLE /data
# filesystem, which buildkitd shares with containerd's images on that node.
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd-config
  namespace: kubesight-buildkit
data:
  buildkitd.toml: |
    [worker.oci]
      gc = true
      # Never trim the cache below this.
      reservedSpace = "2GB"
      # Trim anything above this.
      maxUsedSpace = "20GB"
      # Trim until /data has at least this much free, so the node's images
      # always have room (never below reservedSpace).
      minFreeSpace = "15GB"
  # The /var builder (buildkitd-var below). Its cache sits in node scratch
  # space on the ~5 GiB kubelet disk, so it is kept small and trimmed early.
  buildkitd-var.toml: |
    [worker.oci]
      gc = true
      reservedSpace = "512MB"
      maxUsedSpace = "2GB"
      minFreeSpace = "1500MB"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: kubesight-buildkit
  labels:
    app: buildkitd
spec:
  # Two builders on two different nodes, so a node whose pod network breaks
  # (firewalld back after a reboot, a sick calico-node) takes out one builder,
  # not image builds. Build pods reach each one directly through the headless
  # `buildkitd-pods` Service below and use the first that answers — see
  # CI_BUILDKIT_POOL in ci-backend-config.yaml. Each keeps its layer cache in
  # /data/buildkit on its node (see "Layer cache on /data" at the volume);
  # KubeSight keeps each service on the same builder while it is healthy so
  # that cache stays warm.
  replicas: 2
  # The two builders may never share a node (required anti-affinity below), so
  # a rollout must free a slot before it fills one: without this the surge pod
  # waits for a third labelled node.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: buildkitd
  template:
    metadata:
      labels:
        app: buildkitd
      annotations:
        # AppArmor, same reason as seccomp below. This beta annotation is the
        # portable spelling: it is honoured on every version KubeSight targets,
        # including 1.30+ where it is deprecated in favour of
        # securityContext.appArmorProfile. Do NOT swap to that field until every
        # target cluster is 1.30+ — older API servers reject the unknown field
        # outright under kubectl's default strict validation (they do not prune
        # it), and the whole Deployment apply fails.
        container.apparmor.security.beta.kubernetes.io/buildkitd: unconfined
    spec:
      # buildkitd resolves registry hosts ITSELF — it performs the base-image
      # pull and the final push, not the build pod. So a stage's host aliases
      # cannot redirect them; if one DNS name fronts several registries here,
      # map it for the daemon:
      #
      hostAliases:
         - ip: "10.4.23.182"
           hostnames: ["registry.areeba.com"]
      
      # Note this applies to EVERY image build, including base-image pulls, so
      # the address must serve both. Addressing the registry by IP in its
      # KubeSight connection avoids the question entirely.
      affinity:
        # Only nodes whose /data is the big local disk. Label each such node:
        #   kubectl label node <node> kubesight.io/buildkit-disk=true
        # A builder may move to ANY labelled node (node failure, drain,
        # eviction); it starts with a cold cache on a node it has not used yet.
        # Without the label it would land on a node where /data/buildkit is a
        # folder on the 5 GiB root disk, which is the problem this solves.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubesight.io/buildkit-disk
                    operator: In
                    values: ["true"]
        podAntiAffinity:
          # Required: two buildkitd daemons on one node would share the same
          # /data/buildkit directory, and the second cannot open the first's
          # state database. Label at least three nodes so a builder always has
          # somewhere to go while another node is down.
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: buildkitd
      initContainers:
        # hostPath DirectoryOrCreate makes /data/buildkit as root:root 0755,
        # which rootless buildkitd (uid 1000) cannot write. Hand it over, every
        # start, on whichever node this pod landed.
        - name: own-cache
          image: moby/buildkit:v0.23.2-rootless
          command: ["chown", "1000:1000", "/cache"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: cache
              mountPath: /cache
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 64Mi
      serviceAccountName: buildkitd
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.23.2-rootless
          args:
            - --addr
            - tcp://0.0.0.0:1234
            - --oci-worker-no-process-sandbox
          ports:
            - containerPort: 1234
          securityContext:
            # Relaxation 1 of 2. See the disclosure at the top of this file.
            seccompProfile:
              type: Unconfined
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            # Relaxation 2 of 2: rootlesskit maps a range of subordinate UIDs
            # via the setuid helpers /usr/bin/newuidmap and newgidmap. Those
            # need no_new_privs OFF (so the setuid bit still elevates) and
            # SETUID/SETGID in the bounding set (so the elevated helper may
            # hold them). With either missing, buildkitd dies at startup with
            # "newuidmap ... operation not permitted" and CrashLoopBackOffs.
            # Everything outside those two capabilities is still dropped, the
            # process still runs as uid 1000, and it is still not privileged.
            allowPrivilegeEscalation: true
            capabilities:
              drop: ["ALL"]
              add: ["SETUID", "SETGID"]
          readinessProbe:
            exec:
              # --addr is mandatory here: the daemon is started with an explicit
              # --addr, which REPLACES the default unix socket rather than
              # adding to it. A bare `buildctl debug workers` dials
              # unix:///run/user/1000/buildkit/buildkitd.sock, finds nothing,
              # and the pod never becomes Ready even though the daemon is fine.
              command: ["buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 20
          volumeMounts:
            - name: cache
              mountPath: /home/user/.local/share/buildkit
            # Rootless buildkitd reads ~/.config/buildkit/buildkitd.toml on its
            # own; no --config flag needed.
            - name: config
              mountPath: /home/user/.config/buildkit/buildkitd.toml
              subPath: buildkitd.toml
              readOnly: true
          resources:
            # Ephemeral storage is now only the container's own writable layer
            # and logs: every build lands in /data/buildkit, which is a hostPath
            # and not counted here. Keep these small — every node's kubelet disk
            # is ~5 GiB, and that is what got builders evicted mid-build.
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 256Mi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 2Gi
      volumes:
        # Layer cache on /data. /data is a 100 GB local xfs disk on the workers
        # (vg_data-lv_data), separate from the ~5 GiB kubelet disk, which a
        # single heavy build used to fill — DiskPressure, then the builder was
        # evicted mid-build ("graceful_stop"). The disk is shared with
        # containerd's images (/data/containerd), so buildkitd.toml caps the
        # cache and always leaves free space for them.
        - name: cache
          hostPath:
            path: /data/buildkit
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: buildkitd-config
---
# The /var builder: same daemon and the same security context as buildkitd
# above (see the disclosure at the top), but its layer cache is an emptyDir in
# node scratch space under /var/lib/kubelet, so it needs no /data disk and may
# run on any node. That disk is ~5 GiB on these nodes: a heavy image here can be
# evicted mid-build, which is why image stages default to the /data builders
# and only use this one when a stage's "Build disk" is /var. One replica: when
# it is down, /var stages fall back to the /data builders (and say so).
# Its own app label keeps it out of the buildkitd Deployment's selector, the
# `buildkitd` ClusterIP Service and the /data builders' anti-affinity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd-var
  namespace: kubesight-buildkit
  labels:
    app: buildkitd-var
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildkitd-var
  template:
    metadata:
      labels:
        app: buildkitd-var
      annotations:
        container.apparmor.security.beta.kubernetes.io/buildkitd: unconfined
    spec:
      hostAliases:
        - ip: "10.4.23.182"
          hostnames: ["registry.areeba.com"]
      serviceAccountName: buildkitd
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.23.2-rootless
          args:
            - --addr
            - tcp://0.0.0.0:1234
            - --oci-worker-no-process-sandbox
          ports:
            - containerPort: 1234
          securityContext:
            seccompProfile:
              type: Unconfined
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: true
            capabilities:
              drop: ["ALL"]
              add: ["SETUID", "SETGID"]
          readinessProbe:
            exec:
              command: ["buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 20
          volumeMounts:
            - name: cache
              mountPath: /home/user/.local/share/buildkit
            - name: config
              mountPath: /home/user/.config/buildkit/buildkitd.toml
              subPath: buildkitd-var.toml
              readOnly: true
          resources:
            # The cache counts as ephemeral storage here. 3Gi of a ~4.6 GB
            # allocatable disk: past it the kubelet evicts this pod rather than
            # letting it push the whole node into DiskPressure.
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 3Gi
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 3Gi
        - name: config
          configMap:
            name: buildkitd-config
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: kubesight-buildkit
spec:
  selector:
    app: buildkitd
  ports:
    - port: 1234
      targetPort: 1234
      protocol: TCP
---
# One DNS record per Ready buildkitd pod (clusterIP: None), so KubeSight can hand
# each image stage every builder's own address instead of the one ClusterIP
# above. A pod that is not Ready drops out of the answer on its own.
apiVersion: v1
kind: Service
metadata:
  name: buildkitd-pods
  namespace: kubesight-buildkit
spec:
  clusterIP: None
  selector:
    app: buildkitd
  ports:
    - port: 1234
      targetPort: 1234
      protocol: TCP
---
# The same for the /var builder: CI_BUILDKIT_POOL_VAR in ci-backend-config.yaml.
apiVersion: v1
kind: Service
metadata:
  name: buildkitd-var-pods
  namespace: kubesight-buildkit
spec:
  clusterIP: None
  selector:
    app: buildkitd-var
  ports:
    - port: 1234
      targetPort: 1234
      protocol: TCP
---
# Only CI build pods may talk to buildkitd; buildkitd may only reach DNS and
# registries (TLS + optional custom Nexus docker port). Covers both builder
# sets (/data and /var).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: buildkitd
  namespace: kubesight-buildkit
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["buildkitd", "buildkitd-var"]
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubesight-ci
      ports:
        - protocol: TCP
          port: 1234
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # buildkitd is the process that PUSHES the built image, so the registry's
    # port must be listed here or the push hangs with no useful error. Trim this
    # list to the ports your registries actually use.
    - ports:
        - protocol: TCP
          port: 443
        # Plain HTTP for OS package mirrors: Debian/Ubuntu apt uses
        # http://deb.debian.org, so a Dockerfile `apt-get update` times out
        # without it. apt verifies every package's signature.
        - protocol: TCP
          port: 80
        # Common self-hosted Nexus docker connector ports.
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 5000
        - protocol: TCP
          port: 9443
