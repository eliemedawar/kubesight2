# Native CI — one hand-made build cache volume.
#
# For a cluster with NO StorageClass: nothing here needs a provisioner. Same
# shape as this cluster's existing volumes (jpts-sit-volume and friends) — an
# NFS export, ReadWriteMany, Retain — statically bound to the claim below by
# `claimRef` + `volumeName`.
#
# `sh k8s/ci-cache.sh create` applies exactly this with the values filled in,
# and also carries enable / disable / status / clean / verify. Read this file
# for WHY each field is the way it is; run that script to actually do it.
#
# WHAT GETS CACHED
#   Every stage mounts this volume at /kubesight-cache, and KubeSight points each build
#   tool it knows at a subdirectory of it — Maven, Gradle, npm, yarn, pnpm,
#   pip, Go, Cargo, Composer, NuGet, plus XDG_CACHE_HOME as the catch-all for
#   everything else. Nothing has to be set per pipeline; a stage that sets one
#   of those variables itself still wins.
#
#   One claim holds every service, each under its own subtree. The subtree is
#   $KUBESIGHT_CACHE_DIR, and every stage gets it whether or not the pipeline
#   mentions it:
#       $KUBESIGHT_CACHE_DIR = /kubesight-cache/<service-slug>
#         /gradle                 <- $GRADLE_USER_HOME        (deps, wrapper)
#         /gradle-build-cache     <- $GRADLE_BUILD_CACHE_DIR  (task outputs)
#         /dependency-check-data  <- $DC_DATA_DIR             (the NVD database)
#         /semgrep                <- $SEMGREP_CACHE_DIR       (rulesets)
#         /buildkit               <- $BUILDKIT_CACHE_DIR      (image layers)
#         /maven                  <- $MAVEN_OPTS -Dmaven.repo.local
#         /npm /yarn /pnpm /pip /go /cargo /composer /nuget /xdg
#   Two services never share a tool's lock files, and a service's own builds
#   warm each other's cache. KubeSight creates the five named subdirectories at
#   the start of every stage; the rest are made by the tools on first use, so
#   only the export root has to exist.
#
#   The volume is ALSO mounted at /cache, where it used to live, so a pipeline
#   that still hardcodes /cache/<service-slug> reads the same directories. That
#   second mount is compatibility only — write new pipelines against
#   $KUBESIGHT_CACHE_DIR. See CI-CACHE.md for the full contract.
#
#   ONE GOTCHA: a stage that sets MAVEN_OPTS itself (for -Xmx, say) replaces
#   the injected value and silently goes back to a cold ~/.m2 in /tmp. Keep
#   the repository in it: MAVEN_OPTS=-Xmx2g -Dmaven.repo.local=$KUBESIGHT_CACHE/maven
#
# ─────────────────────────────────────────────────────────────────────────────
# BEFORE APPLYING — two things
#
# 1. Create the export directory ON THE NFS SERVER and give it to the build uid:
#       sudo mkdir -p /datauat/NFS-DATA/ci-cache
#       sudo chown 65532:65532 /datauat/NFS-DATA/ci-cache
#       sudo chmod 2775 /datauat/NFS-DATA/ci-cache
#    Stage containers run as uid 65532 with a read-only root filesystem and no
#    capability to chown anything. The build Job does set fsGroup 65532, but on
#    an NFS mount that chown is performed by kubelet AS ROOT against the server
#    — so an export with root_squash (the default on most servers) silently
#    refuses it. Doing it on the server is the step that actually works. The
#    setgid bit keeps the group on the subdirectories the build tools create.
#
# 2. Size it against the export, not the nodes:
#       df -h /datauat/NFS-DATA
#    `capacity` below is only matching metadata — NFS enforces nothing — so it
#    is the export that fills up. Unlike a node-local volume, filling it evicts
#    nothing; builds simply start failing to write. 20Gi is a comfortable start
#    for a handful of Java/Node services.
#
# THEN: `sh k8s/ci-cache.sh enable` (or set CI_CACHE_CLAIM_NAME: ci-cache in
# k8s/ci-backend-config.yaml and restart the backend). KubeSight never creates,
# resizes or deletes the volume named there; a build fails fast with an
# explanation if the claim is missing.
#
# CLEARING A CACHE: `sh k8s/ci-cache.sh clean <service-slug>` (or --all). It
# refuses while that service has a build running, and empties the subtree from
# inside a pod, so it needs no shell on the NFS server.
#
# IF YOU HAVE NO NFS EXPORT TO SPARE: swap the `nfs:` block for a node
# directory and pin it —
#       local:
#         path: /var/lib/kubesight/ci-cache
#       nodeAffinity:
#         required:
#           nodeSelectorTerms:
#             - matchExpressions:
#                 - key: kubernetes.io/hostname
#                   operator: In
#                   values: ["worker-1"]
#    with accessModes ReadWriteOnce. `MODE=local NODE=worker-1 sh
#    k8s/ci-cache.sh create` does that. Two consequences: every build pod is
#    then pinned to that node (so it must not carry a NoSchedule taint — build
#    pods have no tolerations), and the cache grows on the node's own disk,
#    where filling it evicts pods for DiskPressure. Prefer the NFS form above.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kubesight-ci-cache
  labels:
    kubesight.io/purpose: ci-dependency-cache
spec:
  # Matching metadata, not a quota. See step 2 above.
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  # RWX like this cluster's other NFS volumes: builds of different services run
  # concurrently on any node. Two concurrent builds of the SAME service would
  # still share one Gradle/Maven directory, so keep that service's max
  # concurrent builds at 1 unless you know its build tool tolerates it.
  accessModes:
    - ReadWriteMany
  # Retain: the whole point is that the cache outlives claims and builds.
  persistentVolumeReclaimPolicy: Retain
  # Empty string, not a class name: "do not involve dynamic provisioning".
  # (The existing volumes here say `default`, which works the same way as long
  # as no StorageClass by that name exists — with claimRef and volumeName both
  # set, the binding is explicit either way.)
  storageClassName: ""
  # Pre-bound to the claim below, so no other pending claim in the cluster can
  # take this volume while it is unbound.
  claimRef:
    namespace: kubesight-ci
    name: ci-cache
  nfs:
    # The cluster's existing NFS server — the one jpts-sit-volume mounts.
    server: 10.4.27.17
    path: /datauat/NFS-DATA/ci-cache
  # Left at the server's defaults, like the other volumes here. If Gradle
  # starts complaining about lock files, pin NFSv4 — its locking is part of the
  # protocol, where v3 depends on a working rpc.lockd:
  #   mountOptions: ["nfsvers=4.1", "hard", "timeo=600"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ci-cache
  namespace: kubesight-ci
  labels:
    app.kubernetes.io/name: kubesight-ci
    kubesight.io/purpose: ci-dependency-cache
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: kubesight-ci-cache
  resources:
    requests:
      # Must be <= the PV's capacity or the two never bind.
      storage: 20Gi
---
# ─────────────────────────────────────────────────────────────────────────────
# BuildKit's layer cache — deliberately NOT here.
#
# Everything above caches dependencies for command stages. Container image
# stages have a second, separate cache: buildkitd's own layer store, which
# k8s/ci-buildkitd.yaml keeps in an emptyDir that empties on every restart.
#
# Do NOT point that at this NFS volume. The snapshotter underneath it needs a
# real local filesystem (overlayfs upper/work dirs, hardlinks, whiteout files);
# on NFS it is unsupported and fails in confusing ways rather than merely
# slowly.
#
# Two things that do work:
#   - CI_BUILDKIT_REGISTRY_CACHE: "1" — keeps the layer cache in Nexus beside
#     the image. Survives losing the pod or the node, shared by every builder,
#     costs a push/pull per build. Reach for this one first.
#   - A node-local PV (`local:` + nodeAffinity, RWO, in kubesight-buildkit)
#     mounted at /home/user/.local/share/buildkit and owned by uid 1000 — what
#     rootless buildkitd runs as. Faster, but tied to one node's disk.
# ─────────────────────────────────────────────────────────────────────────────
