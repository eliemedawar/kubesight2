apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubesight-ingress
  namespace: kubesight
  annotations:
    # Selects the external ingress-nginx controller instance (preserved as-is
    # from the live object — do not "reconcile" with spec.ingressClassName).
    kubernetes.io/ingress.class: ingress-nginx-external
    # Allow large mobile binaries (APK/AAB/IPA) through the /api upload endpoint.
    # ingress-nginx defaults to 1m, which 413s anything bigger. 0 = unlimited.
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
spec:
  ingressClassName: nginx
  rules:
    - host: kubesight.areeba.com
      http:
        paths:
          - backend:
              service:
                name: backend-service
                port:
                  number: 5000
            path: /api
            pathType: Prefix
          - backend:
              service:
                name: backend-service
                port:
                  number: 5000
            path: /health
            pathType: Exact
          - backend:
              service:
                name: frontend-service
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - kubesight.areeba.com
      secretName: areebasecret-2026
