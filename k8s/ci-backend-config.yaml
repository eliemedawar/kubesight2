# Native CI — backend configuration.
#
# Apply this, then add ONE block to the kubesight-backend container (alongside
# its existing `env:` list — `env:` entries win over `envFrom`, so this is
# additive and safe):
#
#   envFrom:
#     - configMapRef:
#         name: kubesight-ci-integration
#
# Then restart the backend. Values below are cluster-specific: they are filled
# in for the areeba cluster, so re-applying this file overwrites whatever the
# live ConfigMap holds. Check CI_WORKER_IMAGE's tag against the deployed
# backend before applying.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubesight-ci-integration
  namespace: kubesight
data:
  # --- Where builds run -----------------------------------------------------
  CI_KUBERNETES_NAMESPACE: kubesight-ci
  CI_SERVICE_ACCOUNT: kubesight-ci-build

  # The build pod's checkout/collector containers run the backend image (it
  # carries git + python3). The code default is `kubesight-backend:latest`, a
  # bare tag no node can pull — every build fails at checkout unless this is a
  # real registry path. Keep the tag in step with the deployed backend.
  CI_WORKER_IMAGE: registry.areeba.com/kubesight-backend:v1.1.95
  CI_IMAGE_PULL_POLICY: IfNotPresent

  # Where the collector posts logs, status and artifacts back to. The code
  # default assumes a Service named `kubesight-backend`; this cluster's Service
  # is `backend-service` (same one the ingress and the Hermes ConfigMap use), so
  # this MUST be set or every build hangs with no callback.
  CI_WORKER_CALLBACK_URL: http://backend-service.kubesight.svc.cluster.local:5000/api/ci/worker
  # The per-build NetworkPolicy opens egress to this namespace/port so the
  # callback above can be reached. Keep the three in agreement.
  CI_BACKEND_NAMESPACE: kubesight
  CI_BACKEND_PORT: "5000"

  # Dependency repositories build pods must reach on non-standard TCP ports.
  # Build pods get DNS, the callback, 443 and the container registry's port by
  # default — a Maven/npm repo on its own port is invisible to that logic and
  # fails as a connect TIMEOUT inside Gradle/npm. 4443 is the Nexus Maven port.
  CI_EXTRA_EGRESS_PORTS: "4443"

  # --- Container image builds ----------------------------------------------
  # Empty/unset = container_image stages skip with an explanation. Set once
  # k8s/ci-buildkitd.yaml is applied and the buildkitd pod is 1/1 Ready.
  CI_BUILDKIT_ADDR: tcp://buildkitd.kubesight-buildkit.svc.cluster.local:1234

  # --- Image scanning (the gate between build and push) ---------------------
  # A container_image stage with scanning ARMED does not let buildkitd push at
  # all: the image comes back to the build pod as an archive, Trivy reads it,
  # and only a passing verdict reaches the `crane push` on the next line. The
  # registry never holds an image that failed its own gate, not even briefly.
  #
  # Scanning is per stage and OFF until someone arms it in the pipeline editor,
  # so nothing below changes any build until they do.
  #
  # The image carrying buildctl + trivy + crane. Build and mirror it first:
  #   docker build -f Dockerfile.ci-imagetools \
  #     -t registry.areeba.com/kubesight-ci-imagetools:v1 .
  # The code already defaults to exactly this name, so this key is only needed
  # if you tag it differently. Until the image exists, an ARMED stage fails to
  # pull and says so; a stage with scanning off is untouched.
  #   CI_IMAGE_TOOLS_IMAGE: registry.areeba.com/kubesight-ci-imagetools:v1
  #
  # Trivy's vulnerability database. On a cluster with no route out, mirror it
  # and name the mirror, or the first scan spends its timeout reaching a host
  # it cannot get to:
  #   CI_TRIVY_DB_REPOSITORY: registry.areeba.com/aquasecurity/trivy-db
  #   CI_TRIVY_SKIP_DB_UPDATE: "1"
  # The database is cached on the build cache volume configured below, so it is
  # fetched once rather than on every build.
  #
  # ── READ THIS BEFORE ARMING A GATE ON THIS CLUSTER ────────────────────────
  # A scanned stage parks the WHOLE IMAGE, uncompressed, on /workspace between
  # the build and the push. These nodes have ~4.5Gi allocatable ephemeral
  # storage, which fits a checkout and a jar and does not fit a typical JVM
  # service image plus its archive.
  #
  # Nothing caps that any more (see Per-stage resources below: disk is open by
  # default), so the failure to expect here is the NODE filling up rather than
  # the pod being evicted at its own ceiling. Arming a gate on these nodes still
  # wants one of: nodes with more ephemeral storage, or a smaller image — a JRE
  # base rather than a JDK one is usually most of it.
  #
  # Where a cap IS in force — set below, or per service in Settings — KubeSight
  # raises it for scanned image stages only, to the larger of the cap and these:
  #   CI_IMAGE_SCAN_WORKSPACE_SIZE_LIMIT: 8Gi   # the shared /workspace emptyDir
  #   CI_IMAGE_SCAN_EPHEMERAL_LIMIT: 8Gi        # that one container's cap
  # A cap a SERVICE chose is never raised behind its back: a ceiling that moves
  # on its own is not a ceiling.

  # --- Artifact store -------------------------------------------------------
  # Where uploaded artifacts (jars, reports, APKs) are written. Container
  # images are NOT stored here — only their registry coordinates and digest are
  # recorded, the bytes stay in the registry.
  #
  # Left unset deliberately, so the default applies: /app/data/ci_artifacts in
  # the backend container, laid out as <serviceId>/<buildId>/<filename>.
  #
  # Note what that means: it is a directory INSIDE the container, so every
  # rollout of the backend deletes every stored artifact — old download links
  # break, and "Rerun from here" stops working, because it restores from
  # exactly these files. To make them durable, set this to a path with a
  # PersistentVolume mounted over it on the Deployment:
  #   CI_ARTIFACT_DIR: /var/lib/kubesight/ci-artifacts

  # --- Dependency cache -----------------------------------------------------
  # The single biggest build-time saving: without it every build re-downloads
  # its whole dependency graph. Two ways to give it one; both mount at /cache,
  # and either way KubeSight points Maven, Gradle, npm, yarn, pnpm, pip, Go,
  # Cargo, Composer, NuGet and XDG_CACHE_HOME at it automatically. A stage that
  # sets one of those variables itself still wins. Neither set = no cache, and
  # every build starts cold.
  #
  # (a) A volume you made by hand — the only option on a cluster with no
  # StorageClass. k8s/ci-cache-volume.yaml is an NFS export (this cluster's
  # usual shape), and k8s/ci-cache.sh applies it plus the export-side chown
  # that decides whether builds can write at all:
  #     sh k8s/ci-cache.sh create      make the PV + PVC
  #     sh k8s/ci-cache.sh verify      prove a build pod can write to it
  #     sh k8s/ci-cache.sh enable      set the key below and restart the backend
  #     sh k8s/ci-cache.sh disable     stop caching, keep the volume
  #     sh k8s/ci-cache.sh status      what is on, bound, and how big
  #     sh k8s/ci-cache.sh clean <svc> empty one service's cache (or --all)
  # One claim serves every service, each under /cache/<service-slug>/. KubeSight
  # never creates, resizes or deletes this volume, and a build fails fast with
  # an explanation if the claim is missing.
  CI_CACHE_CLAIM_NAME: ci-cache
  #
  # (b) Dynamic, when the cluster HAS a provisioner: name a StorageClass that
  # supports ReadWriteOnce and KubeSight creates one PVC per service itself,
  # with the tool caches directly under /cache/. Ignored while (a) is set.
  #   CI_CACHE_STORAGE_CLASS: "your-storage-class"
  #   CI_CACHE_SIZE: 10Gi
  #
  # Either way, builds of different services can run concurrently (the NFS
  # volume is ReadWriteMany; a ReadWriteOnce one still allows several pods on
  # one node), while two concurrent builds of the SAME service would share one
  # Gradle/Maven directory. Keep a service's max concurrent builds at 1 unless
  # its build tool tolerates that.

  # Keep BuildKit's layer cache in the registry beside the image, so it
  # survives a buildkitd restart instead of living in that pod's emptyDir.
  # Writes an extra <repository>:buildcache tag.
  #   CI_BUILDKIT_REGISTRY_CACHE: "1"

  # --- Per-stage resources --------------------------------------------------
  # These are the INSTALLATION defaults. A service overrides them in Service
  # Catalog -> Settings -> Build resources, and a single stage overrides that in
  # the pipeline editor; whichever is nearest wins, per field.
  #
  # CPU and memory are sized for nodes with ~4.5Gi allocatable ephemeral-storage.
  # The request is what the scheduler matches; the limit only caps.
  CI_STAGE_CPU_LIMIT: "2"
  CI_STAGE_MEMORY_LIMIT: 4Gi
  # Disk is OPEN by default — both keys left off the manifest entirely: no cap on
  # what a build writes, and nothing reserved from the scheduler. The trade, so
  # it is chosen rather than inherited: a pod with no request is the first thing
  # kubelet evicts under disk pressure, and a build with no limit can fill the
  # node. Both are visible as node pressure, where an operator is looking; the
  # capped failure is an eviction mid-build that the build log cannot explain.
  #
  # To account for disk again, name a quantity here (a matching 256Mi request is
  # added automatically, so the scheduler does not demand the full cap free on
  # every node), or cap only the services that need it from the UI.
  CI_STAGE_EPHEMERAL_REQUEST: "off"
  CI_STAGE_EPHEMERAL_LIMIT: "off"
  # The /workspace emptyDir shared by every stage of a build. A second ceiling,
  # enforced by evicting the pod, so it is "off" for the same reason. A cap set
  # here must fit on the node beside buildkitd's layer cache; KubeSight raises it
  # on its own only to match a larger limit a service or stage was granted.
  CI_WORKSPACE_SIZE_LIMIT: "off"

  # --- Housekeeping ---------------------------------------------------------
  CI_JOB_TTL_SECONDS: "900"
  CI_STALE_BUILD_MINUTES: "120"

  # Artifacts are the one part of CI that grows without bound, so they expire.
  # Defaults: removed a day after they are written, swept once a day, and the
  # newest build's artifacts kept whatever their age — "Rerun from here"
  # restores from exactly those files. Container images are never touched: the
  # row points at a registry, so deleting it frees nothing and loses the record.
  #
  # 0 days = keep forever (and no sweep). CI_ARTIFACT_KEEP_LAST=0 gives up the
  # rerun guard in exchange for the disk. The Artifacts tab states whatever is
  # set here, and offers the same cleanup by hand.
  CI_ARTIFACT_RETENTION_DAYS: "1"
  CI_ARTIFACT_KEEP_LAST: "1"
  CI_ARTIFACT_AUTOCLEAN: "true"
  #   CI_ARTIFACT_PURGE_INTERVAL_HOURS: "24"
