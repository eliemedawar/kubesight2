# Native CI — backend configuration.
#
# Apply this, then add ONE block to the kubesight-backend container (alongside
# its existing `env:` list — `env:` entries win over `envFrom`, so this is
# additive and safe):
#
#   envFrom:
#     - configMapRef:
#         name: kubesight-ci-integration
#
# Then restart the backend. Values below are cluster-specific; the two marked
# REPLACE-ME will not work as shipped.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubesight-ci-integration
  namespace: kubesight
data:
  # --- Where builds run -----------------------------------------------------
  CI_KUBERNETES_NAMESPACE: kubesight-ci
  CI_SERVICE_ACCOUNT: kubesight-ci-build

  # REPLACE-ME. The build pod's checkout/collector containers run the backend
  # image (it carries git + python3). The default is `kubesight-backend:latest`,
  # a bare tag no node can pull — every build fails at checkout until this is a
  # real registry path.
  CI_WORKER_IMAGE: registry.example.com/kubesight/kubesight-backend:replace-me
  CI_IMAGE_PULL_POLICY: IfNotPresent

  # Where the collector posts logs, status and artifacts back to. The code
  # default assumes a Service named `kubesight-backend`; this cluster's Service
  # is `backend-service` (same one the ingress and the Hermes ConfigMap use), so
  # this MUST be set or every build hangs with no callback.
  CI_WORKER_CALLBACK_URL: http://backend-service.kubesight.svc.cluster.local:5000/api/ci/worker
  # The per-build NetworkPolicy opens egress to this namespace/port so the
  # callback above can be reached. Keep the three in agreement.
  CI_BACKEND_NAMESPACE: kubesight
  CI_BACKEND_PORT: "5000"

  # Dependency repositories build pods must reach on non-standard TCP ports.
  # Build pods get DNS, the callback, 443 and the container registry's port by
  # default — a Maven/npm repo on its own port is invisible to that logic and
  # fails as a connect TIMEOUT inside Gradle/npm. 4443 is the Nexus Maven port.
  CI_EXTRA_EGRESS_PORTS: "4443"

  # --- Container image builds ----------------------------------------------
  # Empty/unset = container_image stages skip with an explanation. Set once
  # k8s/ci-buildkitd.yaml is applied and the buildkitd pod is 1/1 Ready.
  CI_BUILDKIT_ADDR: tcp://buildkitd.kubesight-buildkit.svc.cluster.local:1234

  # --- Artifact store -------------------------------------------------------
  # Where uploaded artifacts (jars, reports, APKs) are written. Container
  # images are NOT stored here — only their registry coordinates and digest are
  # recorded, the bytes stay in the registry.
  #
  # Left unset deliberately, so the default applies: /app/data/ci_artifacts in
  # the backend container, laid out as <serviceId>/<buildId>/<filename>.
  #
  # Note what that means: it is a directory INSIDE the container, so every
  # rollout of the backend deletes every stored artifact — old download links
  # break, and "Rerun from here" stops working, because it restores from
  # exactly these files. To make them durable, set this to a path with a
  # PersistentVolume mounted over it on the Deployment:
  #   CI_ARTIFACT_DIR: /var/lib/kubesight/ci-artifacts

  # --- Dependency cache -----------------------------------------------------
  # The single biggest build-time saving: without it every build re-downloads
  # its whole dependency graph. Two ways to give it one; both mount at /cache,
  # and either way KubeSight points Maven, Gradle, npm, yarn, pnpm, pip, Go,
  # Cargo, Composer, NuGet and XDG_CACHE_HOME at it automatically. A stage that
  # sets one of those variables itself still wins. Neither set = no cache, and
  # every build starts cold.
  #
  # (a) A volume you made by hand — the only option on a cluster with no
  # StorageClass. k8s/ci-cache-volume.yaml is an NFS export (this cluster's
  # usual shape), and k8s/ci-cache.sh applies it plus the export-side chown
  # that decides whether builds can write at all:
  #     sh k8s/ci-cache.sh create      make the PV + PVC
  #     sh k8s/ci-cache.sh verify      prove a build pod can write to it
  #     sh k8s/ci-cache.sh enable      set the key below and restart the backend
  #     sh k8s/ci-cache.sh disable     stop caching, keep the volume
  #     sh k8s/ci-cache.sh status      what is on, bound, and how big
  #     sh k8s/ci-cache.sh clean <svc> empty one service's cache (or --all)
  # One claim serves every service, each under /cache/<service-slug>/. KubeSight
  # never creates, resizes or deletes this volume, and a build fails fast with
  # an explanation if the claim is missing.
  CI_CACHE_CLAIM_NAME: ci-cache
  #
  # (b) Dynamic, when the cluster HAS a provisioner: name a StorageClass that
  # supports ReadWriteOnce and KubeSight creates one PVC per service itself,
  # with the tool caches directly under /cache/. Ignored while (a) is set.
  #   CI_CACHE_STORAGE_CLASS: "your-storage-class"
  #   CI_CACHE_SIZE: 10Gi
  #
  # Either way, builds of different services can run concurrently (the NFS
  # volume is ReadWriteMany; a ReadWriteOnce one still allows several pods on
  # one node), while two concurrent builds of the SAME service would share one
  # Gradle/Maven directory. Keep a service's max concurrent builds at 1 unless
  # its build tool tolerates that.

  # Keep BuildKit's layer cache in the registry beside the image, so it
  # survives a buildkitd restart instead of living in that pod's emptyDir.
  # Writes an extra <repository>:buildcache tag.
  #   CI_BUILDKIT_REGISTRY_CACHE: "1"

  # --- Per-stage resources --------------------------------------------------
  # Sized for nodes with ~4.5Gi allocatable ephemeral-storage. The request is
  # what the scheduler matches; the limit only caps. Raise both on bigger nodes.
  CI_STAGE_CPU_LIMIT: "2"
  CI_STAGE_MEMORY_LIMIT: 4Gi
  CI_STAGE_EPHEMERAL_REQUEST: 256Mi
  CI_STAGE_EPHEMERAL_LIMIT: 1Gi
  # The /workspace emptyDir shared by every stage of a build. Must fit on the
  # node's ephemeral storage next to buildkitd's layer cache.
  CI_WORKSPACE_SIZE_LIMIT: 2Gi

  # --- Housekeeping ---------------------------------------------------------
  CI_JOB_TTL_SECONDS: "900"
  CI_STALE_BUILD_MINUTES: "120"
